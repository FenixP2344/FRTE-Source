[DoorBufferVolume]
Type=DoorBufferVolume

BlockTrace=false
AddFocus=false

;This context catches any candidates that don't match any of the contexts above
[CatchAll]
BlockTrace=true

[SwatGame.SummonSettings]
;Server side range check for the "come here" order. Keep in sync with
;   Range in [SummonCompliantAI] above.
SummonMaxRange=2000.0

;Effect event played on the officer who gives the order, so a custom
;   voice line can be added without touching any code: add an effect
;   event of this name to the officer's effect events, then name it
;   here. Leave blank for no speech.
SummonSpeechEvent=SummonCompliantSuspect

;  Grace period (seconds) a suspect/hostage must have been kneeling before the
;  player can call them over.
MinCompliantTimeForSummon=3.0

[SwatGame.SwatPlayerExtras]
; Recoil pitch cap: 2730.5 Unreal rotator units is approximately 15 degrees.
MaxRecoilPitch=730.5
; Mode 2 silver-gray overlay alpha. Lower values keep the wash subdued.
NVGWhiteHotAlpha=72
NVGMode=1

