; FRTE LLM Bridge + in-game UnrealScript listener
; Put this file in the game System folder as FRTELLM.ini

[SwatGame.LLMCommandBridge]
bEnabled=True
BridgePort=27117
BridgeToken=frte-llm-local-7f42a1c9
StateInterval=0.75
SnapshotTTL=45.0

[FRTE.LLMBridge]
; Required: MiMo / OpenAI-compatible API key (do NOT type in console)
ApiKey=
; Must match BridgeToken above
BridgeToken=frte-llm-local-7f42a1c9
BridgePort=27117
Host=127.0.0.1
BaseUrl=https://token-plan-cn.xiaomimimo.com/v1
PlanModel=mimo-v2.5
AsrModel=mimo-v2.5-asr
TtsModel=mimo-v2.5-tts
TtsVoice=冰糖
TtsEnabled=false
; true = always use cloud model for command matching (no local keyword if-match)
PreferModelMatching=true
RequestTimeout=45
MaxCompletionTokens=256
; Global push-to-talk hotkey (keyboard lib). Hold to talk, release to send.
PushToTalkHotkey=f8
PushToTalkMaxSeconds=12
